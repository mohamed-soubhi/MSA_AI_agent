<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Chat</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --err: #f43f5e;
    --bubble-user: #3b82f6;
    --bubble-assistant: #1e293b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .layout {
    display: flex;
    height: 100vh;
  }
  .chat-pane {
    flex: 1 1 55%;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .side-pane {
    flex: 1 1 45%;
    min-width: 280px;
    padding: 24px;
    overflow-y: auto;
    color: var(--text-dim);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.125rem; margin: 0; }
  header a { color: var(--text-dim); font-size: 0.8125rem; text-decoration: none; margin-right: 12px; }
  header a:hover { color: var(--text); }
  #new-chat-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.8125rem;
    cursor: pointer;
  }
  #new-chat-btn:hover { background: var(--border); color: var(--text); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.9375rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user { background: var(--bubble-user); color: white; border-bottom-right-radius: 3px; }
  .bubble.assistant { background: var(--bubble-assistant); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .bubble.error { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--err); color: var(--err); }
  .bubble.pending::after {
    content: "▍";
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9375rem;
    max-width: 340px;
  }
  form#composer {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  #composer textarea {
    flex: 1;
    resize: none;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.9375rem;
    font-family: inherit;
    max-height: 140px;
    min-height: 44px;
  }
  #composer textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  #composer button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  #composer button:hover { background: var(--accent-hover); }
  #composer button:disabled { opacity: 0.6; cursor: not-allowed; }
  .side-pane h2 { color: var(--text); font-size: 1rem; margin: 0 0 10px; }
  .side-pane .placeholder {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
    font-size: 0.875rem;
  }
</style>
</head>
<body>
<div class="layout">
  <div class="chat-pane">
    <header>
      <h1>Agent Chat</h1>
      <div>
        <a href="/config">Config</a>
        <button id="new-chat-btn" type="button">New chat</button>
      </div>
    </header>
    <div id="messages">
      <div class="empty-state" id="empty-state">
        Ask anything. This is plain conversational chat — no file/shell
        tools wired in here yet, just the model.
      </div>
    </div>
    <form id="composer">
      <textarea id="input" placeholder="Message the agent…" rows="1"></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
  <div class="side-pane">
    <h2>Context</h2>
    <div class="placeholder">
      This panel will show things related to the conversation — coming soon.
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById("messages");
const emptyState = document.getElementById("empty-state");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const newChatBtn = document.getElementById("new-chat-btn");

function addBubble(role, text) {
  emptyState.style.display = "none";
  const row = document.createElement("div");
  row.className = `bubble-row ${role === "user" ? "user" : ""}`;
  const bubble = document.createElement("div");
  bubble.className = `bubble ${role}`;
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

async function loadHistory() {
  const res = await fetch("/api/chat/history");
  const data = await res.json();
  messagesEl.innerHTML = "";
  if (data.messages.length === 0) {
    messagesEl.appendChild(emptyState);
    emptyState.style.display = "block";
    return;
  }
  for (const m of data.messages) {
    addBubble(m.role, m.content);
  }
}

async function sendMessage(event) {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addBubble("user", text);
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;

  const assistantBubble = addBubble("assistant", "");
  assistantBubble.classList.add("pending");

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok || !res.body) throw new Error(`Request failed (${res.status})`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let fullText = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split("\n\n");
      buffer = events.pop(); // last chunk may be incomplete -- keep it buffered

      for (const evt of events) {
        const line = evt.trim();
        if (!line.startsWith("data:")) continue;
        const payload = JSON.parse(line.slice(5).trim());

        if (payload.delta) {
          fullText += payload.delta;
          assistantBubble.textContent = fullText;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (payload.error) {
          assistantBubble.classList.remove("pending");
          assistantBubble.classList.add("error");
          assistantBubble.textContent = "Error: " + payload.error;
        } else if (payload.done) {
          assistantBubble.classList.remove("pending");
        }
      }
    }
  } catch (err) {
    assistantBubble.classList.remove("pending");
    assistantBubble.classList.add("error");
    assistantBubble.textContent = "Error: " + err.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

async function newChat() {
  await fetch("/api/chat/reset", { method: "POST" });
  messagesEl.innerHTML = "";
  messagesEl.appendChild(emptyState);
  emptyState.style.display = "block";
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", sendMessage);
newChatBtn.addEventListener("click", newChat);
loadHistory();
</script>
</body>
</html>
