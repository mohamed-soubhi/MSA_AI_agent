# Reverse proxy: Nginx (port 80) -> Uvicorn (127.0.0.1:8000).
#
# Local dev: `nginx -c $(pwd)/BE/nginx/nginx.conf` (or copy into
# /etc/nginx/sites-available/ on a real box). Uvicorn must already be
# running on the upstream port below (see run_be.sh / run_be.bat).
#
# Update `upstream` if BE_PORT is overridden, and `server_name` once a
# real domain exists.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream agent_backend {
        server 127.0.0.1:8000;
    }

    # WebSocket upgrade support -- needed once the chat API adds a
    # streaming/WebSocket endpoint (not used by /health yet, but wired
    # in now so adding one later doesn't require touching this file).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10m;

        location / {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://agent_backend/health;
            access_log off;
        }
    }
}
