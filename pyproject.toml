[project]
name = "MSA_AI_agent"
version = "1.0.0"
description = "Sandboxed AI coding agent (CLI + FastAPI backend) built on Ollama tool-calling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "ollama>=0.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
